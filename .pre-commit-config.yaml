repos:
  - repo: local
    hooks:
      - id: anti-leak
        name: Anti-leak IP check
        entry: bash .git-hooks/pre-commit-anti-leak.sh
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14  # matches uv.lock ruff==0.15.14
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0  # matches uv.lock mypy==2.1.0
    hooks:
      - id: mypy
        args: [--ignore-missing-imports]
